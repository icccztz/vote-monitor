<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>投票监测 · 长虹新生态百工图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #584ffb;
    --primary-light: #f0efff;
    --gold: #f5a623;
    --silver: #b0b0b0;
    --bronze: #cd7f32;
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-light: #8a8a9a;
    --green: #22c55e;
    --red: #ef4444;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    padding-bottom: 20px;
  }
  .header {
    background: linear-gradient(135deg, #584ffb 0%, #7c3aed 100%);
    color: #fff;
    padding: 16px 16px 20px;
    border-radius: 0 0 20px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 4px 12px rgba(88,79,251,0.25);
  }
  .header h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .header .subtitle { font-size: 12px; opacity: 0.85; }
  .header .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 12px;
  }
  .refresh-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    backdrop-filter: blur(10px);
  }
  .refresh-btn:active { transform: scale(0.95); }
  .refresh-btn.loading { opacity: 0.6; }
  .countdown { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 12px; }
  .status {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .dot.ok { background: var(--green); }
  .dot.err { background: var(--red); }
  .dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .podium {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 0 16px;
    margin-bottom: 16px;
  }
  .podium-item {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
  }
  .podium-item.rank1 { grid-column: 2; grid-row: 1; }
  .podium-item.rank2 { grid-column: 1; grid-row: 1; margin-top: 20px; }
  .podium-item.rank3 { grid-column: 3; grid-row: 1; margin-top: 30px; }
  .medal {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    margin: 0 auto 8px;
  }
  .medal.gold { background: linear-gradient(135deg,#ffd700,#ffaa00); }
  .medal.silver { background: linear-gradient(135deg,#c0c0c0,#909090); }
  .medal.bronze { background: linear-gradient(135deg,#cd7f32,#a0522d); }
  .podium-item .name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 32px;
  }
  .podium-item .votes { font-size: 14px; font-weight: 700; color: var(--primary); }
  .podium-item .votes span { font-size: 10px; color: var(--text-light); font-weight: 400; }
  .target-card {
    margin: 0 16px 16px;
    background: linear-gradient(135deg, #fff7e6 0%, #fff 100%);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(245,166,35,0.15);
  }
  .target-card .label { font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
  .target-card .name { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .target-card .rank-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .target-card .rank-num { font-size: 32px; font-weight: 800; color: var(--gold); line-height: 1; }
  .target-card .rank-label { font-size: 13px; color: var(--text-light); }
  .target-card .my-votes { font-size: 14px; color: var(--text); }
  .target-card .my-votes b { color: var(--primary); font-size: 18px; }
  .gaps { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e0d8c0; }
  .gap-title { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
  .gap-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
  }
  .gap-item .left { display: flex; align-items: center; gap: 6px; color: var(--text); flex: 1; min-width: 0; }
  .gap-item .left .rk { font-weight: 700; color: var(--primary); min-width: 18px; }
  .gap-item .left .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .gap-item .right { font-weight: 700; color: var(--red); white-space: nowrap; margin-left: 8px; }
  .gap-item .right.behind { color: var(--red); }
  .gap-item .right.ahead { color: var(--green); }
  .gap-item .right .arrow { font-size: 10px; }
  .section-title { font-size: 14px; font-weight: 700; padding: 0 16px 10px; color: var(--text); }
  .rank-list { padding: 0 16px; }
  .rank-row-item {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .rank-row-item.target {
    background: linear-gradient(90deg, #fff7e6 0%, #fff 100%);
    border: 1.5px solid var(--gold);
  }
  .rank-row-item .order { width: 28px; font-size: 15px; font-weight: 800; text-align: center; color: var(--text-light); }
  .rank-row-item .order.top { color: var(--gold); }
  .rank-row-item .name { flex: 1; font-size: 13px; font-weight: 500; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-row-item.target .name { font-weight: 700; color: var(--gold); }
  .rank-row-item .votes { font-size: 14px; font-weight: 700; color: var(--primary); }
  .rank-row-item .votes span { font-size: 10px; font-weight: 400; color: var(--text-light); }
  .footer { text-align: center; padding: 20px 16px; font-size: 11px; color: var(--text-light); }
  .footer a { color: var(--primary); text-decoration: none; }
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    display: none;
    max-width: 80%;
    text-align: center;
  }
  .toast.show { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🏆 投票监测看板</h1>
    <div class="subtitle">奋斗筑梦 劳动最美 · 专题榜单</div>
    <div class="meta">
      <button class="refresh-btn" id="refreshBtn">
        <span id="refreshIcon">🔄</span> 刷新
      </button>
      <div class="countdown" id="countdown">下次刷新 30分00秒</div>
    </div>
  </div>

  <div class="status">
    <span><span class="dot loading" id="statusDot"></span><span id="statusText">正在加载...</span></span>
    <span id="lastUpdate">—</span>
  </div>

  <div class="podium" id="podium"></div>
  <div class="target-card" id="targetCard"></div>
  <div class="section-title">📋 完整排行榜</div>
  <div class="rank-list" id="rankList"></div>

  <div class="footer">
    数据来源：<a href="https://act.tmlyun.com/vote/rank?q=h2oLSH8WH1Gy/ZqKmkHYt122FPFLD9355qtSXCPADu0=" target="_blank">投票活动页面</a>
    <br>每 30 分钟自动刷新 · 仅供监测参考
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  targetName: '长虹新生态百工图',
  q: 'h2oLSH8WH1Gy/ZqKmkHYt122FPFLD9355qtSXCPADu0=',
  groupId: 2894,
  refreshInterval: 1800, // 30分钟
  apiBase: '/api' // 通过 Vercel Serverless Function 代理，无跨域问题
};

const TARGET = CONFIG.targetName;
let cachedJwt = null;
let cachedJwtTime = 0;
let countdownTimer = null;
let countdown = CONFIG.refreshInterval;
let isLoading = false;

const $ = id => document.getElementById(id);
const podiumEl = $('podium');
const targetCardEl = $('targetCard');
const rankListEl = $('rankList');
const statusDot = $('statusDot');
const statusText = $('statusText');
const lastUpdateEl = $('lastUpdate');
const refreshBtn = $('refreshBtn');
const refreshIcon = $('refreshIcon');
const countdownEl = $('countdown');
const loadingOverlay = $('loadingOverlay');
const toastEl = $('toast');

function showToast(msg, duration = 2500) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), duration);
}

function setStatus(state, text) {
  statusDot.className = 'dot ' + state;
  statusText.textContent = text;
}

async function login() {
  const now = Date.now();
  if (cachedJwt && (now - cachedJwtTime) < 6 * 3600 * 1000) {
    return cachedJwt;
  }
  const resp = await fetch(CONFIG.apiBase + '/auth/userLogin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ q: CONFIG.q })
  });
  const data = await resp.json();
  if (data.success && data.data && data.data.token) {
    cachedJwt = data.data.token;
    cachedJwtTime = now;
    return cachedJwt;
  }
  throw new Error(data.message || '登录失败');
}

async function fetchRank() {
  const jwt = await login();
  const resp = await fetch(CONFIG.apiBase + '/activity/rank?groupId=' + CONFIG.groupId, {
    headers: { 'Authorization': jwt, 'Accept': 'application/json' }
  });
  const data = await resp.json();
  if (data.success && Array.isArray(data.data)) {
    return data.data;
  }
  throw new Error(data.message || '获取排行失败');
}

function formatNum(n) { return n.toLocaleString('zh-CN'); }

function renderPodium(top3) {
  const medals = [
    { cls: 'gold', num: '1' },
    { cls: 'silver', num: '2' },
    { cls: 'bronze', num: '3' }
  ];
  const order = [1, 0, 2];
  let html = '';
  order.forEach(idx => {
    const item = top3[idx];
    const m = medals[idx];
    if (!item) return;
    const isTarget = item.name === TARGET;
    html += `
      <div class="podium-item rank${idx+1}" ${isTarget ? 'style="border:2px solid var(--gold)"' : ''}>
        <div class="medal ${m.cls}">${m.num}</div>
        <div class="name">${item.name}</div>
        <div class="votes">${formatNum(item.voteNumber)}<span>赞</span></div>
      </div>`;
  });
  podiumEl.innerHTML = html;
}

function renderTargetCard(data, myIndex, top3) {
  const my = data[myIndex];
  const myVotes = my.voteNumber;
  const myRank = myIndex + 1;
  let gapsHtml = '';
  if (myIndex <= 2) {
    gapsHtml = '<div class="gap-title">相邻名次差距</div>';
    if (myIndex > 0) {
      const prev = data[myIndex - 1];
      const diff = prev.voteNumber - myVotes;
      gapsHtml += `<div class="gap-item">
        <div class="left"><span class="rk">${myIndex}</span><span class="nm">${prev.name}</span></div>
        <div class="right behind"><span class="arrow">▲</span> 差 ${formatNum(diff)}</div>
      </div>`;
    }
    if (myIndex < data.length - 1) {
      const next = data[myIndex + 1];
      const diff = myVotes - next.voteNumber;
      gapsHtml += `<div class="gap-item">
        <div class="left"><span class="rk">${myIndex+2}</span><span class="nm">${next.name}</span></div>
        <div class="right ahead"><span class="arrow">▼</span> 领先 ${formatNum(diff)}</div>
      </div>`;
    }
  } else {
    gapsHtml = '<div class="gap-title">距离前三名</div>';
    for (let i = 0; i < 3; i++) {
      const top = top3[i];
      const diff = top.voteNumber - myVotes;
      gapsHtml += `<div class="gap-item">
        <div class="left"><span class="rk">${i+1}</span><span class="nm">${top.name}</span></div>
        <div class="right behind">差 ${formatNum(diff)}</div>
      </div>`;
    }
  }
  const rankWord = ['一','二','三','四','五','六','七','八','九','十'];
  const rankLabel = myRank <= 10 ? '第' + rankWord[myRank-1] + '名' : '第' + myRank + '名';
  targetCardEl.innerHTML = `
    <div class="label">⭐ 关注作品</div>
    <div class="name">${my.name}</div>
    <div class="rank-row">
      <span class="rank-num">${myRank}</span>
      <span class="rank-label">${rankLabel} · 当前票数</span>
    </div>
    <div class="my-votes"><b>${formatNum(myVotes)}</b> 赞</div>
    <div class="gaps">${gapsHtml}</div>
  `;
}

function renderRankList(data, myIndex) {
  let html = '';
  data.forEach((item, idx) => {
    const isTarget = idx === myIndex;
    const topCls = idx < 3 ? 'top' : '';
    html += `
      <div class="rank-row-item ${isTarget ? 'target' : ''}">
        <div class="order ${topCls}">${idx + 1}</div>
        <div class="name">${item.name}</div>
        <div class="votes">${formatNum(item.voteNumber)}<span>赞</span></div>
      </div>`;
  });
  rankListEl.innerHTML = html;
}

async function loadData(showOverlay = false) {
  if (isLoading) return;
  isLoading = true;
  if (showOverlay) loadingOverlay.classList.add('show');
  refreshBtn.classList.add('loading');
  refreshIcon.textContent = '⏳';
  setStatus('loading', '正在获取数据...');
  try {
    const data = await fetchRank();
    const top3 = data.slice(0, 3);
    const myIndex = data.findIndex(item => item.name === TARGET);
    if (myIndex === -1) showToast('未找到「' + TARGET + '」');
    renderPodium(top3);
    if (myIndex >= 0) {
      renderTargetCard(data, myIndex, top3);
    } else {
      targetCardEl.innerHTML = '<div class="label">⭐ 关注作品</div><div class="name" style="color:var(--red)">未找到「' + TARGET + '」</div>';
    }
    renderRankList(data, myIndex);
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' +
                    now.getMinutes().toString().padStart(2,'0') + ':' +
                    now.getSeconds().toString().padStart(2,'0');
    lastUpdateEl.textContent = '更新于 ' + timeStr;
    setStatus('ok', '数据正常');
  } catch (e) {
    console.error(e);
    setStatus('err', '获取失败');
    showToast('获取数据失败：' + (e.message || '未知错误'));
  } finally {
    isLoading = false;
    if (showOverlay) loadingOverlay.classList.remove('show');
    refreshBtn.classList.remove('loading');
    refreshIcon.textContent = '🔄';
    countdown = CONFIG.refreshInterval;
  }
}

function formatCountdown(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + '分' + s.toString().padStart(2, '0') + '秒';
}

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      loadData(false);
    } else {
      countdownEl.textContent = '下次刷新 ' + formatCountdown(countdown);
    }
  }, 1000);
}

refreshBtn.addEventListener('click', () => loadData(true));
loadData(true);
startCountdown();
</script>
</body>
</html>
